<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-glow"></div>

  <div class="app">

    <nav class="topbar">
      <div class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        </div>
        <span>Canvas Dashboard</span>
      </div>
      <div class="topbar-tag">Frontend Web Dev &middot; ALU</div>
    </nav>

    <section class="hero">
      <div class="hero-text">
        <h1>Assignment Tracker</h1>
        <p>Scraped data from your Canvas portal, visualized.</p>
      </div>
      <div class="stats-row" id="stats"></div>
    </section>

    <section class="toolbar">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="Search assignments..." autocomplete="off">
      </div>
      <div class="pills" id="pills">
        <button class="pill active" data-f="all">All</button>
        <button class="pill" data-f="assignment">
          <span class="dot dot-blue"></span>Coursework
        </button>
        <button class="pill" data-f="reading">
          <span class="dot dot-violet"></span>Readings
        </button>
        <button class="pill" data-f="submitted">
          <span class="dot dot-green"></span>Done
        </button>
        <button class="pill" data-f="pending">
          <span class="dot dot-amber"></span>Pending
        </button>
      </div>
    </section>

    <section class="progress-wrap" id="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-label" id="progress-label"></span>
    </section>

    <div id="empty" class="empty" style="display:none">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 15h8M9 9h.01M15 9h.01"/></svg>
      <p>No assignments match your search.</p>
    </div>

    <div id="grid" class="grid"></div>

    <footer>
      <p>Data source: <strong>canvas_assignments.json</strong> &mdash; generated by <code>node scraper.js</code></p>
    </footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
