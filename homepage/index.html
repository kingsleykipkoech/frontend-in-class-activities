<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book & Notes Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <a href="#" class="logo">VAULT</a>

            <ul class="nav-links">
                <li><a href="#about" class="active">About</a></li>
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#catalog">Catalog</a></li>
                <li><a href="#preferences">Preferences</a></li>
            </ul>

            <button type="button" class="btn-new-book">+ New Book</button>
        </nav>
    </header>

    <main class="hero">
        <div class="hero-container">
            <h1 class="hero-title">
                <span>Nurturing Knowledge.</span>
                <span>Empowering Mastery.</span>
            </h1>

            <div class="hero-bottom-grid">
                <div class="card-spotlight">
                    <div class="cover-wrapper">
                        <img src="./assets/book-cover.jpg" alt="Computer Systems Book Cover" class="book-cover">
                    </div>

                    <div class="book-details">
                        <span class="badge-gold">PICK OF THE MONTH</span>
                        <h2 class="book-title">Computer Systems</h2>
                        <p class="book-author">by Randal Bryant & David O'Hallaron</p>
                        <p class="book-synopsis">
                            Foundations of architecture, memory hierarchy & hardware-software interface.
                        </p>
                        <a href="#catalog" class="link-view-book">View Book &rarr;</a>
                    </div>
                </div>

                <div class="explore-action">
                    <a href="#catalog" class="btn-explore">Explore Catalog (25 Volumes) &rarr;</a>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
